        symbol: SetupMachineCardValues
      - file: packages/webui/src/machine-setup-draft.ts
        symbol: formatSetupMachineChatSubmission
    ui_surfaces:
      - file: packages/webui/src/SetupConversationCard.tsx
        label: Setup Machine card in the current Chat
    tests:
      - file: packages/plugin/tests/setup-command.spec.ts
        title: starts an ordinary human turn so a setup session is not reused as blank
      - file: packages/webui/tests/setup-conversation-card.test.tsx
        title: submits one tagged structured message to the current Chat and becomes read-only
      - file: packages/webui/tests/chat-presentation-definitions.test.ts
