name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source requirement traceability
        run: pnpm traceability
      - name: Check source, tests, and builds
        run: pnpm check:code
      - name: Install and smoke-test the shareable plugin
        run: pnpm plugin:smoke --no-build
      - name: Start the standalone launcher in a fresh home
        run: pnpm launcher:smoke
      - name: Package the plugin for download
        run: pnpm plugin:pack --no-build
      - uses: actions/upload-artifact@v6
        with:
          name: dsh-slop-plugin-${{ matrix.os }}
          path: |
            artifacts/dsh-slop-*.tgz
            artifacts/dsh-slop-*.tgz.sha256
          if-no-files-found: error
      - name: Pack and smoke-test the portable launcher release
        if: runner.os != 'Windows'
        run: pnpm release:smoke
